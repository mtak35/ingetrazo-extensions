[name]
es = "CAD2IngeTrazo · De planos CAD a BIM"
en = "CAD2IngeTrazo · CAD plans to BIM"
pt = "CAD2IngeTrazo · De plantas CAD a BIM"

[summary]
es = "Convierte plantas de AutoCAD (DWG/DXF) en un modelo BIM editable, nivel por nivel: muros, puertas, ventanas, pilares, losas, escaleras, terrazas, plataforma, sitio, muebles, estacionamiento — y láminas con los grosores del CAD."
en = "Turns AutoCAD floor plans (DWG/DXF) into an editable BIM model, level by level: walls, doors, windows, columns, slabs, stairs, terraces, foundation platform, site, furniture, parking — and sheets with the CAD's own line weights."
pt = "Converte plantas do AutoCAD (DWG/DXF) em um modelo BIM editável, nível por nível: paredes, portas, janelas, pilares, lajes, escadas, terraços, plataforma, terreno, móveis, estacionamento — e pranchas com as espessuras do CAD."

[description]
es = "Lee cada planta por sus capas — y por lo que dicen sus líneas ocultas (discontinuas): vanos, arcos, ventanas altas, aleros, voladizos y cortes de losa — y apila los pisos a su altura real. Cada elemento es un tipo de componente con nombre (D-01, W-03, C-02…) que se selecciona, edita o reemplaza por un componente de la biblioteca de IngeTrazo. Desde la 3.11: losas como pisos sobre una plataforma de cimentación con las gradas de entrada como están dibujadas; escaleras que siguen el plano (SUBE/BAJA, compensadas, tramos editables, acabados y narices); terrazas con barandas; losa de cubierta, vanos y diseños de parapeto; diseños de muro perimetral y portones de la biblioteca que se mueven con sus pilares; muebles y sanitarios de los bloques CAD mirando a los ambientes, en baja poligonización (alta para render); cocinas con Kitchen Maker; autos sobre el piso terminado. Las láminas llevan el trazo del propio CAD con sus grosores de impresión (CTB). PDF, DXF y SketchUp .skp. El panel en 10 idiomas, con actualización desde GitHub en un clic. Manual de usuario (inglés): https://github.com/mtak35/cad2ingetrazo/blob/main/docs/MANUAL.md"
en = "Reads each plan by its layers — and by what its hidden (dashed) lines say: openings, arches, high windows, sun shades, slab projections and cuts — and stacks the floors at their true heights. Every element is a named component type (D-01, W-03, C-02…) you can select, edit as a whole, or replace with an IngeTrazo library component. Since 3.11: slabs as floors on a foundation platform with entrance steps as drawn; stairs that follow the plan (UP/DN, winders, editable flights, finishes and nosings); terraces with railings; roof slab, openings and parapet designs; boundary wall designs and library gates movable with their pillars; furniture and fixtures from the CAD blocks facing the rooms, low-poly for speed (high-poly for rendering); kitchens with Kitchen Maker; cars on the finished floor. Sheets carry the CAD's own linework at its plotted line weights (CTB). PDF, DXF and a real SketchUp .skp. The panel in 10 languages, with a one-click update from GitHub. User manual: https://github.com/mtak35/cad2ingetrazo/blob/main/docs/MANUAL.md"
pt = "Lê cada planta pelas suas camadas — e pelo que dizem as linhas ocultas (tracejadas): vãos, arcos, janelas altas, brises, balanços e cortes de laje — e empilha os pisos na altura real. Cada elemento é um tipo de componente com nome (D-01, W-03, C-02…) que se seleciona, edita ou substitui por um componente da biblioteca do IngeTrazo. Desde a 3.11: lajes como pisos sobre uma plataforma de fundação com os degraus de entrada como desenhados; escadas que seguem a planta (SOBE/DESCE, leques, lances editáveis, acabamentos e bocéis); terraços com guarda-corpos; laje de cobertura, vãos e desenhos de platibanda; desenhos de muro de divisa e portões da biblioteca que se movem com os pilares; móveis e louças dos blocos CAD voltados para os ambientes, em baixa poligonização (alta para render); cozinhas com o Kitchen Maker; carros sobre o piso acabado. As pranchas levam o traço do próprio CAD com as espessuras de plotagem (CTB). PDF, DXF e SketchUp .skp. O painel em 10 idiomas, com atualização pelo GitHub num clique. Manual do usuário (inglês): https://github.com/mtak35/cad2ingetrazo/blob/main/docs/MANUAL.md"
